# GlassCam AI — configuration file
# Push to Glass with:  adb push glasscam.conf /sdcard/glasscam/glasscam.conf
#
# Then restart the service:
#   adb shell am stopservice -n com.glasscam/.CameraStreamService
#   adb shell am startservice -n com.glasscam/.CameraStreamService

# IP of the machine running server/app.py  (use phone hotspot IP or LAN IP)
server_url=http://192.168.1.100:5000

# Seconds between automatic captures (minimum 2 to avoid camera thrash)
interval=4

# Default prompt sent with each frame
prompt=Briefly describe what you see in one sentence, as if speaking to the wearer.

# Unique name for this pair of Glass (useful if you have multiple)
device_id=glass_01

# Save a local JPEG copy to /sdcard/glasscam/captures/
save_locally=true

# Send frames to the AI server
stream=true

# JPEG compression quality (0-100). 80 is a good balance of quality vs upload speed.
jpeg_quality=80
